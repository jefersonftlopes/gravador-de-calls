<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Ícone do Gravador de Calls: quadrado arredondado azul, onda sonora branca e o ponto vermelho
       de gravação. Fonte dos PNGs de 32, 48 e 128 px; o de 16 px tem desenho próprio (icon-16.svg),
       alinhado ao pixel. Renderizar com: node scripts/renderizar-icones.mjs -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#tile)"/>
  <g fill="#ffffff">
    <rect x="14" y="41" width="11" height="26" rx="5.5"/>
    <rect x="31" y="27" width="11" height="54" rx="5.5"/>
    <rect x="48" y="35" width="11" height="38" rx="5.5"/>
    <rect x="65" y="45" width="11" height="18" rx="5.5"/>
  </g>
  <circle cx="74" cy="22" r="14" fill="#ffffff"/>
  <circle cx="74" cy="22" r="10.5" fill="#ef4444"/>
</svg>
